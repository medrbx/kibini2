# Nécessite : a2enmod proxy proxy_http
# Vhost de test en parallèle de kibini_prod ; une fois validé, reprendre ce
# bloc ProxyPass dans le vhost prod existant (celui qui pointe aujourd'hui
# vers dispatch.cgi/dispatch.fcgi) pour basculer.
<VirtualHost *:80>
    ServerName kibini2-test.interne

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:1793/
    ProxyPassReverse / http://127.0.0.1:1793/
</VirtualHost>
